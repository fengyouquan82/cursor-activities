<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background: #eef2f7;
      color: #1f2937;
    }

    .card {
      width: min(420px, calc(100% - 2rem));
      padding: 2rem;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.14);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      text-align: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1rem;
    }

    label {
      font-size: 0.95rem;
      font-weight: 600;
    }

    input,
    select,
    button {
      width: 100%;
      font: inherit;
      padding: 0.55rem 0.7rem;
    }

    button {
      margin-top: 0.25rem;
      cursor: pointer;
    }

    #result {
      margin-top: 1rem;
      min-height: 1.5rem;
    }

    #result p {
      margin: 0.25rem 0;
    }

    #result.error {
      color: #b42318;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tip Calculator</h1>
    <!-- input for bill amount, dropdown for tip percent 10 15 20, number of people, a Calculate button, and a result area -->
    <div class="field">
      <label for="bill">Bill amount</label>
      <input type="number" id="bill" name="bill">
    </div>

    <div class="field">
      <label for="tip">Tip percent</label>
      <select id="tip" name="tip">
        <option value="10">10%</option>
        <option value="15">15%</option>
        <option value="20">20%</option>
      </select>
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <input type="number" id="people" name="people">
    </div>

    <button type="button" id="calculate">Calculate</button>

    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
